# GoFlix configuration
# Environment variables override these values when set.
# Set your TMDB API key or Bearer Read Access Token below or via environment variables.

# TMDB credentials
TMDB_API_KEY = your-tmdb-api-key
# TMDB_ACCESS_TOKEN = your-tmdb-v4-bearer-read-access-token

# Dynamic Media Resolver
BROWSER_HEADLESS = true
BROWSER_TIMEOUT = 45s
# The direct resolvers (vidking/vidlove/vixsrc/cinesrc/vidsrcme) handle
# virtually every resolve without a browser; the browser path is only a
# fallback. Each Chrome instance eats 300-500 MB, so on a small VPS keep
# exactly one browser slot.
MAX_BROWSER_SESSIONS = 1
# BROWSER_EXECUTABLE = /path/to/chromium

# In-memory cache (MB) for streamed manifests/segments. Keeps upcoming segments
# downloaded ahead of the player so playback does not stall on slow upstreams.
# On a 4 GB VPS with GOMEMLIMIT set: 512 MB keeps lookahead deep even with
# dozens of concurrent viewers (the cache is one shared LRU — more viewers
# each get a smaller slice automatically).
CACHE_MAX_MB = 512

# Concurrent proxy sessions. Each active session runs a read-ahead pipeline
# and holds upstream connections; sessions are cheap in RAM, the shared
# segment cache and your pipe are the real limits.
MAX_SESSIONS = 200

# Quality cap: cap playback resolution to multiply concurrent capacity.
# 1080 cuts 4K/1440p renditions (ABR stays automatic below the cap), which
# at 500 Mbps roughly triples simultaneous viewers (~25 -> ~80). 0 = off.
# MAX_STREAM_HEIGHT = 1080

# Soft Go memory limit. The Go runtime GCs harder as it approaches this, so
# the process never squeezes out the OS or Chrome. Set this in the service
# environment (it is a standard Go runtime variable, read at startup):
#   GOMEMLIMIT=3GiB
# e.g. in the systemd unit: Environment=GOMEMLIMIT=3GiB
# Media source domains
VIXSRC_ORIGIN = https://vixsrc.to/
VIDKING_ORIGIN = https://www.vidking.net
VIDLOVE_ORIGIN = https://player.vidlove.cc
VIDSRCME_ORIGIN = https://vidsrcme.ru
VIDSRCME_DATA_ORIGIN = https://data.vidsrcme.ru
CINESRC_ORIGIN = https://cinesrc.st

# Accounts: users register at /login with a username + password. When set,
# AUTH_PASSWORD is the invite code required to register (keeps strangers off
# an exposed server); leave unset for open registration on your network.
# AUTH_PASSWORD = invite-code
# USERS_FILE = users.json

# Cross-device sync of My List / playback progress / Continue Watching.
# Set to "-" to disable persistence (sync still works in-memory).
# USERDATA_FILE = userdata.json

# Disk snapshot of the catalog caches so restarts serve real data instantly,
# even before TMDB answers. Set to "-" to disable.
# CATALOG_SNAPSHOT_FILE = catalog_snapshot.json

# Mount Go pprof profiling endpoints under /debug/pprof/ (auth gated).
# DEBUG_PPROF = false

# Resolution cache persistence (instant rewatches, see README).
# RESOLUTION_CACHE_FILE = resolutions.json

# Per-IP rate limits: login/register attempts and media-source resolutions
# per minute (each resolve runs a costly upstream chain). Defaults: 10 / 10.
# AUTH_RATE_PER_MIN = 10
# RESOLVE_RATE_PER_MIN = 10

# HTTPS: set both to enable TLS (session cookies get the Secure flag).
# TLS_CERT = /path/cert.pem
# TLS_KEY = /path/key.pem

# Poster/backdrop disk cache for the /api/img proxy — browsing pulls images
# LAN-fast instead of from the TMDB CDN. Set to "-" to bypass the cache.
# IMAGES_DIR = images
