# GoFlix configuration
# Environment variables override these values when set.
# Set your TMDB API key or Bearer Read Access Token below or via environment variables.

# TMDB credentials
TMDB_API_KEY = your-tmdb-api-key
# TMDB_ACCESS_TOKEN = your-tmdb-v4-bearer-read-access-token

# Dynamic Media Resolver
BROWSER_HEADLESS = true
BROWSER_TIMEOUT = 45s
MAX_BROWSER_SESSIONS = 3
# BROWSER_EXECUTABLE = /path/to/chromium

# In-memory cache (MB) for streamed manifests/segments. Keeps upcoming segments
# downloaded ahead of the player so playback does not stall on slow upstreams.
# 512 covers an 18-segment read-ahead window of 4K-sized chunks (~13 MB each)
# with headroom; lower if RAM is tight.
CACHE_MAX_MB = 512

# Media source domains
VIXSRC_ORIGIN = https://vixsrc.to/
VIDKING_ORIGIN = https://www.vidking.net
VIDLOVE_ORIGIN = https://player.vidlove.cc
VIDSRCME_ORIGIN = https://vidsrcme.ru
VIDSRCME_DATA_ORIGIN = https://data.vidsrcme.ru
CINESRC_ORIGIN = https://cinesrc.st
